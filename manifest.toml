packaging_format = 2

id = "i2p"
name = "I2P router"
description.en = "Volunteer relay strengthening the I2P anonymous network (console on an SSO-gated panel)"

version = "2.13.1~ynh1"

maintainers = []

[upstream]
license = "Public-Domain"
website = "https://geti2p.net"
code = "https://github.com/i2p/i2p.i2p"
admindoc = "https://geti2p.net/en/get-i2p-on-debian-and-ubuntu"

[integration]
yunohost = ">= 12.0"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = false
ldap = "not_relevant"
sso = "not_relevant"
disk = "1G"
ram.build = "50M"
ram.runtime = "900M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/"

    [install.init_main_permission]
    type = "group"
    default = "all_users"

    [install.ext_port]
    ask.en = "External I2NP port (TCP+UDP) to forward on your router"
    help.en = "One port serves both transports (NTCP2=TCP, SSU2=UDP). Forward the SAME port as TCP and UDP on your router to this server, or the router stays 'Firewalled' and relays little."
    type = "number"
    default = 51427

    [install.jvm_xmx]
    ask.en = "Java heap limit (e.g. 768m)"
    help.en = "I2P is a Java app. 768m suits a relay; a floodfill router wants 1g or more."
    type = "string"
    default = "768m"

[resources]
    [resources.system_user]

    [resources.install_dir]

    # Router identity, netDB and config — the crown jewels. Backed up and
    # restored with the app by convention.
    [resources.data_dir]

    [resources.permissions]
        main.url = "/"
        # The I2P console does its own optional auth; ssowat must not inject
        # Basic creds. SSO still gates the URL.
        main.auth_header = false

    [resources.ports]
    main.default = 7657
    # Console port is loopback-bound by the router; no firewall exposure.
    main.exposure = "none"
